spring.application.name=ec-demo

# --- スキーマ管理は Flyway に任せる -----------------------------------------
# Hibernate の自動DDLは切る。改修案件で ddl-auto=update が入っていると
# 「誰がスキーマを変えたのか分からない」状態になるので、Flyway に寄せる。
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# --- SQL を目で見るための設定（このプランの主役） ----------------------------
# 発行された SQL と、そのバインドパラメータを両方出す。
# Step 2 で N+1 を数えるとき・FOR UPDATE が出ているか確認するときに使う。
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# トランザクションの開始・コミット・ロールバックの境界をログで見る。
# Step 2-a で @Transactional の伝播を追うときに必須。
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
logging.level.org.springframework.transaction.interceptor.TransactionInterceptor=TRACE

# --- コネクションプール（HikariCP） ------------------------------------------
# Step 2-b で同時100件を投げてプール枯渇を観測するため、あえて小さくしてある。
# 本番でこの値にする話ではない。
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=5000
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari.pool.HikariPool=DEBUG
